<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BKT POS">
<title>Bak Kut Teh POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FDF6EC;color:#2C1A0E}
:root{
  --primary:#8B1A1A;--primary-dark:#5C0F0F;--secondary:#D4830A;
  --bg:#FDF6EC;--card:#FFFFFF;--text:#2C1A0E;--muted:#8B7355;
  --border:#E8D5B0;--success:#2D7D3A;--danger:#C0392B;
  --shadow:0 2px 8px rgba(44,26,14,0.12);--radius:12px
}

/* ── LAYOUT ── */
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── NAV ── */
.nav{background:var(--primary);color:#fff;display:flex;align-items:center;
  padding:0 16px;height:58px;flex-shrink:0;gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.nav-brand{font-size:17px;font-weight:700;white-space:nowrap;flex-shrink:0}
.nav-tabs{display:flex;gap:4px;flex:1;justify-content:center}
.nav-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;
  padding:8px 18px;border-radius:8px;font-size:15px;font-weight:500;
  cursor:pointer;min-height:40px;transition:background .15s}
.nav-btn.active{background:rgba(255,255,255,0.35)}
.nav-btn:active{background:rgba(255,255,255,0.5)}
.nav-clock{font-size:12px;opacity:.85;text-align:right;line-height:1.5;flex-shrink:0}

/* ── TABS ── */
.tab{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab.active{display:flex}

/* ══════════════════════════════
   POS TAB
══════════════════════════════ */
.pos-wrap{display:flex;flex:1;overflow:hidden}

/* Menu side */
.menu-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:2px solid var(--border)}
.cat-bar{display:flex;gap:8px;padding:10px 12px;background:var(--bg);
  overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border)}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{background:#fff;border:2px solid var(--border);color:var(--muted);
  padding:7px 16px;border-radius:20px;font-size:14px;font-weight:500;
  cursor:pointer;white-space:nowrap;min-height:40px;transition:all .15s}
.cat-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:10px;padding:12px;overflow-y:auto;flex:1;align-content:start}
.menu-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 10px;cursor:pointer;text-align:center;
  box-shadow:var(--shadow);min-height:95px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:transform .1s,border-color .1s}
.menu-card:active{transform:scale(.95);border-color:var(--secondary);background:#FFF3E0}
.menu-card.sold-out{opacity:.4;pointer-events:none}
.menu-emoji{font-size:30px;line-height:1}
.menu-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.menu-price{font-size:15px;font-weight:700;color:var(--primary)}

/* Cart side */
.cart-panel{width:330px;flex-shrink:0;display:flex;flex-direction:column;background:#fff}
.cart-hdr{padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px}
.cart-title{font-size:15px;font-weight:700;flex:1}
.cart-badge{background:var(--primary);color:#fff;border-radius:12px;
  padding:2px 10px;font-size:13px;font-weight:600}
.cart-clear{background:none;border:1px solid var(--border);color:var(--muted);
  padding:5px 11px;border-radius:8px;font-size:13px;cursor:pointer}
.cart-clear:active{background:#FEE;color:var(--danger);border-color:var(--danger)}
.cart-items{flex:1;overflow-y:auto;padding:6px 8px}
.cart-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.cart-empty-icon{font-size:48px;margin-bottom:10px}
.c-item{display:flex;align-items:center;gap:8px;padding:8px 4px;
  border-bottom:1px solid #F5ECD8}
.c-item:last-child{border-bottom:none}
.c-info{flex:1;min-width:0}
.c-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-unit{font-size:12px;color:var(--muted)}
.qty-wrap{display:flex;align-items:center;gap:5px}
.qty-btn{width:28px;height:28px;border-radius:50%;border:none;font-size:16px;
  cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center}
.q-minus{background:#FEE;color:var(--danger)}
.q-plus{background:#E8F5E9;color:var(--success)}
.qty-num{font-size:14px;font-weight:700;min-width:22px;text-align:center}
.c-total{font-size:14px;font-weight:700;min-width:50px;text-align:right}
.cart-foot{border-top:2px solid var(--border);padding:12px 14px;background:#FFFDF8}
.sum-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.sum-row.grand{font-size:18px;font-weight:700;color:var(--primary);
  border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.checkout-btn{width:100%;background:var(--primary);color:#fff;border:none;
  border-radius:var(--radius);padding:15px;font-size:17px;font-weight:700;
  cursor:pointer;margin-top:10px;min-height:52px;transition:background .15s}
.checkout-btn:active{background:var(--primary-dark)}
.checkout-btn:disabled{background:#CCC;cursor:not-allowed}

/* ══════════════════════════════
   MODALS
══════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;
  max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal-wide{max-width:520px}
.modal-hdr{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:18px;font-weight:700}
.modal-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.modal-body{padding:18px}
.modal-foot{padding:0 18px 18px;display:flex;gap:10px}

/* Checkout */
.sec-lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:7px}
.co-items{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.co-item{display:flex;justify-content:space-between;padding:8px 12px;
  border-bottom:1px solid var(--border);font-size:14px}
.co-item:last-child{border-bottom:none}
.co-totals{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px}
.tot-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.tot-row.grand{font-size:19px;font-weight:700;color:var(--primary);
  border-top:2px solid var(--border);padding-top:9px;margin-top:4px}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pay-card{border:2px solid var(--border);background:#fff;border-radius:10px;
  padding:12px 6px;text-align:center;cursor:pointer;transition:all .15s;
  font-size:13px;font-weight:600;color:var(--muted)}
.pay-card .pi{font-size:26px;display:block;margin-bottom:3px}
.pay-card.active{border-color:var(--primary);background:#FFF3E0;color:var(--primary)}
.form-inp{width:100%;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;font-size:15px;outline:none;font-family:inherit;color:var(--text)}
.form-inp:focus{border-color:var(--primary)}
.action-btn{flex:1;padding:13px;border:none;border-radius:10px;
  font-size:16px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-dark)}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}

/* Invoice */
.inv-wrap{font-family:'Courier New',monospace;font-size:13px}
.inv-hdr{text-align:center;padding-bottom:10px;border-bottom:2px dashed #aaa;margin-bottom:10px}
.inv-stall{font-size:18px;font-weight:700}
.inv-sub{font-size:11px;color:#666;margin-top:2px}
.inv-meta{font-size:12px;margin-top:8px;line-height:1.7}
.inv-divider{border:none;border-top:1px dashed #aaa;margin:8px 0}
.inv-col-hdr{display:flex;font-weight:700;border-bottom:1px solid #aaa;
  padding-bottom:4px;margin-bottom:4px;font-size:12px}
.inv-row{display:flex;padding:2px 0;font-size:12px}
.inv-name{flex:1}
.inv-qty{width:34px;text-align:center}
.inv-amt{width:64px;text-align:right}
.inv-totals{font-size:12px;margin-top:4px}
.inv-tot-row{display:flex;justify-content:space-between;padding:2px 0}
.inv-tot-row.grand{font-size:15px;font-weight:700;border-top:2px solid #333;
  padding-top:5px;margin-top:3px}
.inv-foot{text-align:center;font-size:11px;color:#666;margin-top:10px;
  border-top:1px dashed #aaa;padding-top:8px;line-height:1.7}
.btn-print{background:var(--secondary);color:#fff}
.btn-print:active{background:#A06000}

/* ══════════════════════════════
   HISTORY TAB
══════════════════════════════ */
.hist-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:10px}
.hist-toolbar{display:flex;gap:10px;flex-shrink:0}
.hist-search{flex:1;border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:15px;background:#fff;font-family:inherit;outline:none}
.hist-search:focus{border-color:var(--primary)}
.hist-filter{border:1px solid var(--border);border-radius:8px;padding:10px;
  font-size:14px;background:#fff;font-family:inherit}
.hist-list{flex:1;overflow-y:auto}
.hist-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:8px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--shadow);transition:all .15s}
.hist-item:active{background:#FFF3E0;border-color:var(--secondary)}
.hi-left{flex:1;min-width:0}
.hi-inv{font-size:13px;font-weight:700;color:var(--primary)}
.hi-date{font-size:12px;color:var(--muted);margin-top:2px}
.hi-preview{font-size:13px;color:var(--text);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-right{text-align:right;flex-shrink:0;margin-left:12px}
.hi-total{font-size:16px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;margin-top:4px}
.b-cash{background:#E8F5E9;color:#2E7D32}
.b-card{background:#E3F2FD;color:#1565C0}
.b-qr{background:#F3E5F5;color:#7B1FA2}
.empty-msg{text-align:center;padding:48px 20px;color:var(--muted);font-size:15px}

/* ══════════════════════════════
   REPORTS TAB
══════════════════════════════ */
.rep-wrap{flex:1;overflow-y:auto;padding:14px}
.rep-sec{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.rep-title{font-size:16px;font-weight:700;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.stat-card{background:#FFF9F0;border:1px solid var(--border);border-radius:10px;
  padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:800;color:var(--primary)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px}
/* bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:110px;margin:10px 0 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-val-lbl{font-size:9px;color:var(--text);font-weight:600;min-height:12px;text-align:center}
.bar-fill{width:100%;background:var(--primary);border-radius:4px 4px 0 0;min-height:3px;transition:height .3s}
.bar-day{font-size:10px;color:var(--muted)}
/* top items */
.top-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.top-row:last-child{border-bottom:none}
.top-rank{font-size:15px;font-weight:800;color:var(--muted);width:24px}
.top-info{flex:1}
.top-name{font-size:14px;font-weight:600}
.top-bar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:4px}
.top-bar-fg{height:4px;background:var(--primary);border-radius:2px}
.top-right{text-align:right;min-width:72px}
.top-rev{font-size:13px;font-weight:700;color:var(--primary)}
.top-qty{font-size:11px;color:var(--muted)}
/* payment bars */
.pay-bar-row{margin-bottom:12px}
.pay-bar-row:last-child{margin-bottom:0}
.pay-bar-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.pay-bar-bg{height:8px;background:var(--border);border-radius:4px}
.pay-bar-fg{height:8px;border-radius:4px;transition:width .3s}

/* ══════════════════════════════
   SETTINGS TAB
══════════════════════════════ */
.set-wrap{flex:1;overflow-y:auto;padding:14px}
.set-sec{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.set-title{font-size:16px;font-weight:700;margin-bottom:14px}
.form-group{margin-bottom:13px}
.form-lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.form-row{display:flex;align-items:center;gap:12px}
.save-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;
  padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.save-btn:active{background:var(--primary-dark)}
.export-btn{background:var(--secondary);color:#fff;border:none;border-radius:8px;
  padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer}
.export-btn:active{background:#A06000}
/* toggle */
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:#CCC;border-radius:12px;cursor:pointer;transition:.2s}
.toggle-track:before{content:'';position:absolute;height:18px;width:18px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-track{background:var(--success)}
.toggle input:checked+.toggle-track:before{transform:translateX(20px)}
/* menu manage */
.mm-item{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border)}
.mm-item:last-child{border-bottom:none}
.mm-emoji{font-size:22px;flex-shrink:0}
.mm-info{flex:1;min-width:0}
.mm-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-cat{font-size:12px;color:var(--muted)}
.mm-price{font-size:14px;font-weight:700;color:var(--primary);min-width:52px;text-align:right}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── PORTRAIT LAYOUT (iPad portrait) ── */
@media (orientation:portrait) and (max-width:820px){
  .pos-wrap{flex-direction:column}
  .menu-panel{border-right:none;border-bottom:2px solid var(--border)}
  .cart-panel{width:100%;max-height:46vh}
  .cart-items{max-height:calc(46vh - 120px)}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

/* ── PRINT ── */
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:fixed;top:0;left:0;width:80mm;background:#fff;
    padding:8mm;font-family:'Courier New',monospace;font-size:12px}
}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 22px;border-radius:20px;
  font-size:14px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- ── NAV ── -->
  <nav class="nav">
    <div class="nav-brand" id="nav-brand">BKT Stall</div>
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('pos')">POS</button>
      <button class="nav-btn" onclick="switchTab('history')">History</button>
      <button class="nav-btn" onclick="switchTab('reports')">Reports</button>
      <button class="nav-btn" onclick="switchTab('settings')">Settings</button>
    </div>
    <div class="nav-clock" id="nav-clock"></div>
  </nav>

  <!-- ══ POS TAB ══ -->
  <div id="tab-pos" class="tab active">
    <div class="pos-wrap">
      <div class="menu-panel">
        <div class="cat-bar" id="cat-bar"></div>
        <div class="menu-grid" id="menu-grid"></div>
      </div>
      <div class="cart-panel">
        <div class="cart-hdr">
          <span class="cart-title">Current Order</span>
          <span class="cart-badge" id="cart-badge">0</span>
          <button class="cart-clear" onclick="clearCart()">Clear</button>
        </div>
        <div class="cart-items" id="cart-items">
          <div class="cart-empty">
            <div class="cart-empty-icon">🛒</div>
            <div>Tap items to add</div>
          </div>
        </div>
        <div class="cart-foot">
          <div class="sum-row"><span>Subtotal</span><span id="c-subtotal">$0.00</span></div>
          <div class="sum-row" id="gst-row"><span id="gst-lbl">GST (9%)</span><span id="c-tax">$0.00</span></div>
          <div class="sum-row grand"><span>TOTAL</span><span id="c-total">$0.00</span></div>
          <button class="checkout-btn" id="checkout-btn" onclick="openCheckout()" disabled>Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ HISTORY TAB ══ -->
  <div id="tab-history" class="tab">
    <div class="hist-wrap">
      <div class="hist-toolbar">
        <input type="search" class="hist-search" id="hist-search"
          placeholder="Search invoice or items…" oninput="filterHistory()">
        <select class="hist-filter" id="hist-filter" onchange="filterHistory()">
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="all">All Time</option>
        </select>
      </div>
      <div class="hist-list" id="hist-list"></div>
    </div>
  </div>

  <!-- ══ REPORTS TAB ══ -->
  <div id="tab-reports" class="tab">
    <div class="rep-wrap" id="rep-wrap"></div>
  </div>

  <!-- ══ SETTINGS TAB ══ -->
  <div id="tab-settings" class="tab">
    <div class="set-wrap" id="set-wrap"></div>
  </div>
</div>

<!-- ── CHECKOUT MODAL ── -->
<div class="overlay" id="ov-checkout">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title">Checkout</div>
      <button class="modal-x" onclick="closeOverlay('ov-checkout')">✕</button>
    </div>
    <div class="modal-body">
      <div class="sec-lbl">Order Items</div>
      <div class="co-items" id="co-items"></div>
      <div class="co-totals" id="co-totals"></div>
      <div class="sec-lbl" style="margin-top:14px">Payment Method</div>
      <div class="pay-grid">
        <div class="pay-card active" id="pay-cash" onclick="selectPay('cash')">
          <span class="pi">💵</span>Cash
        </div>
        <div class="pay-card" id="pay-card" onclick="selectPay('card')">
          <span class="pi">💳</span>Card
        </div>
        <div class="pay-card" id="pay-qr" onclick="selectPay('qr')">
          <span class="pi">📱</span>PayNow
        </div>
      </div>
      <div class="sec-lbl">Table / Customer (optional)</div>
      <input type="text" class="form-inp" id="cust-name" placeholder="e.g. Table 3 or customer name">
    </div>
    <div class="modal-foot">
      <button class="action-btn btn-ghost" onclick="closeOverlay('ov-checkout')">Cancel</button>
      <button class="action-btn btn-primary" onclick="processPayment()">Confirm & Pay</button>
    </div>
  </div>
</div>

<!-- ── INVOICE MODAL ── -->
<div class="overlay" id="ov-invoice">
  <div class="modal modal-wide">
    <div class="modal-hdr">
      <div class="modal-title">E-Invoice</div>
      <button class="modal-x" onclick="closeOverlay('ov-invoice')">✕</button>
    </div>
    <div class="modal-body">
      <div class="inv-wrap" id="inv-content"></div>
    </div>
    <div class="modal-foot">
      <button class="action-btn btn-ghost" onclick="closeOverlay('ov-invoice')">Close</button>
      <button class="action-btn btn-print" onclick="printInvoice()">🖨 Print</button>
    </div>
  </div>
</div>

<!-- Print area (hidden) -->
<div id="print-area" style="display:none"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ═══════════════════════════════════════
   DATABASE  (IndexedDB)
═══════════════════════════════════════ */
const DB_NAME = 'BKTPosDB', DB_VER = 2;
let db;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { db = r.result; res(db); };
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('txns')) {
        const s = d.createObjectStore('txns', {keyPath:'id', autoIncrement:true});
        s.createIndex('date','date',{unique:false});
      }
      if (!d.objectStoreNames.contains('menu'))
        d.createObjectStore('menu', {keyPath:'id', autoIncrement:true});
      if (!d.objectStoreNames.contains('cfg'))
        d.createObjectStore('cfg', {keyPath:'k'});
    };
  });
}
const dbGet  = (s,k) => new Promise((res,rej) => { const r = db.transaction(s,'readonly').objectStore(s).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbPut  = (s,v) => new Promise((res,rej) => { const r = db.transaction(s,'readwrite').objectStore(s).put(v); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbAdd  = (s,v) => new Promise((res,rej) => { const r = db.transaction(s,'readwrite').objectStore(s).add(v); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbAll  = (s)   => new Promise((res,rej) => { const r = db.transaction(s,'readonly').objectStore(s).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

/* ═══════════════════════════════════════
   DEFAULTS
═══════════════════════════════════════ */
const DEFAULT_CFG = {
  stallName:'Ah Lim Bak Kut Teh',
  address:'Blk 123 Hawker Centre #01-23, Singapore 123456',
  phone:'+65 9123 4567',
  gstNo:'GST123456X',
  gstEnabled:true,
  gstRate:9,
  currency:'SGD',
  sym:'$',
  prefix:'BKT',
  counter:1,
};

const DEFAULT_MENU = [
  {id:1, name:'Bak Kut Teh (Small)',      cat:'Soup',         price:8.00,  avail:true, emoji:'🍲'},
  {id:2, name:'Bak Kut Teh (Large)',      cat:'Soup',         price:12.00, avail:true, emoji:'🍲'},
  {id:3, name:'Dry Bak Kut Teh (Small)', cat:'Soup',         price:9.00,  avail:true, emoji:'🥘'},
  {id:4, name:'Dry Bak Kut Teh (Large)', cat:'Soup',         price:13.00, avail:true, emoji:'🥘'},
  {id:5, name:'Pig Organ Soup',           cat:'Soup',         price:9.00,  avail:true, emoji:'🍜'},
  {id:6, name:'Steamed Rice',             cat:'Rice & Sides', price:1.00,  avail:true, emoji:'🍚'},
  {id:7, name:'You Tiao (2 pcs)',         cat:'Rice & Sides', price:1.50,  avail:true, emoji:'🥖'},
  {id:8, name:'Braised Pork Trotters',    cat:'Rice & Sides', price:8.00,  avail:true, emoji:'🍖'},
  {id:9, name:'Braised Tofu',             cat:'Rice & Sides', price:3.00,  avail:true, emoji:'🫙'},
  {id:10,name:'Braised Peanuts',          cat:'Rice & Sides', price:2.00,  avail:true, emoji:'🥜'},
  {id:11,name:'Extra Ribs',              cat:'Extras',        price:5.00,  avail:true, emoji:'🦴'},
  {id:12,name:'Extra Soup',              cat:'Extras',        price:1.00,  avail:true, emoji:'🥣'},
  {id:13,name:'Chinese Tea (Pot)',        cat:'Drinks',       price:1.50,  avail:true, emoji:'🫖'},
  {id:14,name:'Barley Water',            cat:'Drinks',       price:1.50,  avail:true, emoji:'🥛'},
  {id:15,name:'Sugarcane Juice',         cat:'Drinks',       price:2.00,  avail:true, emoji:'🧃'},
  {id:16,name:'Mineral Water',           cat:'Drinks',       price:1.00,  avail:true, emoji:'💧'},
];

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let cfg  = {...DEFAULT_CFG};
let menu = [];
let cart = [];
let payMethod = 'cash';
let activeCat = 'All';
let allTxns   = [];

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
async function init(){
  await openDB();
  await loadCfg();
  await loadMenu();
  renderMenu();
  renderSettings();
  tick();
  setInterval(tick, 1000);
}

async function loadCfg(){
  const row = await dbGet('cfg','main');
  if (row) cfg = {...DEFAULT_CFG, ...row.v};
  else      await dbPut('cfg', {k:'main', v:cfg});
  applyBrand();
}

async function loadMenu(){
  const rows = await dbAll('menu');
  if (rows.length === 0){
    for (const item of DEFAULT_MENU) await dbAdd('menu', item);
    menu = DEFAULT_MENU.map(i=>({...i}));
  } else {
    menu = rows;
  }
}

function applyBrand(){
  document.getElementById('nav-brand').textContent = cfg.stallName;
  const gr = document.getElementById('gst-row');
  if (gr) gr.style.display = cfg.gstEnabled ? 'flex' : 'none';
  const gl = document.getElementById('gst-lbl');
  if (gl) gl.textContent = `GST (${cfg.gstRate}%)`;
}

function tick(){
  const now = new Date();
  document.getElementById('nav-clock').innerHTML =
    now.toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'})+'<br>'+
    now.toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'});
}

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.getAttribute('onclick') === `switchTab('${name}')`) b.classList.add('active');
  });
  if (name === 'history') loadHistory();
  if (name === 'reports') loadReports();
  if (name === 'settings') renderSettings();
}

/* ═══════════════════════════════════════
   MENU
═══════════════════════════════════════ */
function renderMenu(){
  const cats = ['All', ...new Set(menu.map(i=>i.cat))];
  document.getElementById('cat-bar').innerHTML = cats.map(c =>
    `<button class="cat-btn${c===activeCat?' active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
  const items = activeCat==='All' ? menu : menu.filter(i=>i.cat===activeCat);
  document.getElementById('menu-grid').innerHTML = items.map(item =>
    `<div class="menu-card${!item.avail?' sold-out':''}" onclick="addItem(${item.id})">
       <div class="menu-emoji">${item.emoji||'🍽'}</div>
       <div class="menu-name">${item.name}</div>
       <div class="menu-price">${fmt(item.price)}</div>
     </div>`
  ).join('');
}

function setCat(c){ activeCat=c; renderMenu(); }

/* ═══════════════════════════════════════
   CART
═══════════════════════════════════════ */
function addItem(id){
  const item = menu.find(i=>i.id===id);
  if (!item || !item.avail) return;
  const ex = cart.find(c=>c.id===id);
  if (ex) ex.qty++;
  else cart.push({id, name:item.name, price:item.price, qty:1});
  renderCart();
}

function changeQty(id, delta){
  const idx = cart.findIndex(c=>c.id===id);
  if (idx<0) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx,1);
  renderCart();
}

function clearCart(){ cart=[]; renderCart(); }

function renderCart(){
  const total = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cart-badge').textContent = total;
  const box = document.getElementById('cart-items');
  if (cart.length===0){
    box.innerHTML='<div class="cart-empty"><div class="cart-empty-icon">🛒</div><div>Tap items to add</div></div>';
    document.getElementById('checkout-btn').disabled = true;
  } else {
    box.innerHTML = cart.map(i=>`
      <div class="c-item">
        <div class="c-info">
          <div class="c-name">${i.name}</div>
          <div class="c-unit">${fmt(i.price)} each</div>
        </div>
        <div class="qty-wrap">
          <button class="qty-btn q-minus" onclick="changeQty(${i.id},-1)">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn q-plus"  onclick="changeQty(${i.id},+1)">+</button>
        </div>
        <div class="c-total">${fmt(i.price*i.qty)}</div>
      </div>`).join('');
    document.getElementById('checkout-btn').disabled = false;
  }
  updateTotals();
}

function calcTotals(){
  const sub  = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const rate = cfg.gstEnabled ? cfg.gstRate/100 : 0;
  const tax  = sub * rate;
  return {sub, tax, total: sub+tax};
}

function updateTotals(){
  const {sub,tax,total} = calcTotals();
  document.getElementById('c-subtotal').textContent = fmt(sub);
  document.getElementById('c-tax').textContent      = fmt(tax);
  document.getElementById('c-total').textContent    = fmt(total);
  const gr = document.getElementById('gst-row');
  if (gr) gr.style.display = cfg.gstEnabled ? 'flex' : 'none';
}

/* ═══════════════════════════════════════
   CHECKOUT
═══════════════════════════════════════ */
function openCheckout(){
  if (!cart.length) return;
  payMethod = 'cash';
  ['cash','card','qr'].forEach(p =>
    document.getElementById('pay-'+p).classList.toggle('active', p==='cash'));
  const {sub,tax,total} = calcTotals();
  document.getElementById('co-items').innerHTML =
    cart.map(i=>`<div class="co-item"><span>${i.name} ×${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('');
  let t = `<div class="tot-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>`;
  if (cfg.gstEnabled)
    t += `<div class="tot-row"><span>GST (${cfg.gstRate}%)</span><span>${fmt(tax)}</span></div>`;
  t += `<div class="tot-row grand"><span>TOTAL</span><span>${fmt(total)}</span></div>`;
  document.getElementById('co-totals').innerHTML = t;
  document.getElementById('cust-name').value = '';
  openOverlay('ov-checkout');
}

function selectPay(m){
  payMethod = m;
  ['cash','card','qr'].forEach(p =>
    document.getElementById('pay-'+p).classList.toggle('active', p===m));
}

async function processPayment(){
  const {sub,tax,total} = calcTotals();
  const cust = document.getElementById('cust-name').value.trim();
  const invNo = makeInvNo();
  const txn = {
    invNo, date: new Date().toISOString(),
    items: cart.map(i=>({...i})),
    sub, tax, total,
    gstRate: cfg.gstRate, gstEnabled: cfg.gstEnabled,
    pay: payMethod, cust,
    stallName:cfg.stallName, address:cfg.address,
    phone:cfg.phone, gstNo:cfg.gstNo,
  };
  await dbAdd('txns', txn);
  cfg.counter++;
  await dbPut('cfg',{k:'main', v:cfg});
  closeOverlay('ov-checkout');
  cart=[]; renderCart();
  showInvoice(txn);
  toast('Payment confirmed ✓');
}

function makeInvNo(){
  const d = new Date();
  const ds = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  return `${cfg.prefix}-${ds}-${String(cfg.counter).padStart(4,'0')}`;
}

/* ═══════════════════════════════════════
   INVOICE
═══════════════════════════════════════ */
const PAY_LABELS = {cash:'Cash',card:'Credit/Debit Card',qr:'PayNow / QR'};

function buildInvHTML(tx){
  const d  = new Date(tx.date);
  const ds = d.toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'});
  const ts = d.toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'});
  const rows = tx.items.map(i=>
    `<div class="inv-row">
       <span class="inv-name">${i.name}</span>
       <span class="inv-qty">×${i.qty}</span>
       <span class="inv-amt">${fmt(i.price*i.qty)}</span>
     </div>`).join('');
  let tots = `<div class="inv-tot-row"><span>Subtotal</span><span>${fmt(tx.sub)}</span></div>`;
  if (tx.gstEnabled)
    tots += `<div class="inv-tot-row"><span>GST (${tx.gstRate}%)</span><span>${fmt(tx.tax)}</span></div>`;
  tots += `<div class="inv-tot-row grand"><span>TOTAL</span><span>${fmt(tx.total)}</span></div>`;
  return `
    <div class="inv-hdr">
      <div class="inv-stall">${tx.stallName}</div>
      ${tx.address?`<div class="inv-sub">${tx.address}</div>`:''}
      ${tx.phone?`<div class="inv-sub">Tel: ${tx.phone}</div>`:''}
      ${tx.gstNo?`<div class="inv-sub">GST Reg No: ${tx.gstNo}</div>`:''}
    </div>
    <div class="inv-meta">
      <strong>Invoice No :</strong> ${tx.invNo}<br>
      <strong>Date &amp; Time:</strong> ${ds} ${ts}<br>
      ${tx.cust?`<strong>Customer   :</strong> ${tx.cust}<br>`:''}
      <strong>Payment    :</strong> ${PAY_LABELS[tx.pay]||tx.pay}
    </div>
    <hr class="inv-divider">
    <div class="inv-col-hdr">
      <span class="inv-name">Item</span>
      <span class="inv-qty">Qty</span>
      <span class="inv-amt">Amount</span>
    </div>
    ${rows}
    <hr class="inv-divider">
    <div class="inv-totals">${tots}</div>
    <div class="inv-foot">
      ✦ Thank you for dining with us! ✦<br>
      We look forward to seeing you again.
    </div>`;
}

function showInvoice(tx){
  const html = buildInvHTML(tx);
  document.getElementById('inv-content').innerHTML = html;
  document.getElementById('print-area').innerHTML  = html;
  openOverlay('ov-invoice');
}

function printInvoice(){
  document.getElementById('print-area').style.display='block';
  window.print();
  document.getElementById('print-area').style.display='none';
}

/* ═══════════════════════════════════════
   HISTORY
═══════════════════════════════════════ */
async function loadHistory(){
  allTxns = (await dbAll('txns')).sort((a,b)=>new Date(b.date)-new Date(a.date));
  filterHistory();
}

function filterHistory(){
  const q  = (document.getElementById('hist-search').value||'').toLowerCase();
  const f  = document.getElementById('hist-filter').value;
  const now = new Date();
  let list = allTxns.filter(tx=>{
    const td = new Date(tx.date);
    if (f==='today' && td.toDateString()!==now.toDateString()) return false;
    if (f==='week'  && td < new Date(now-7*864e5)) return false;
    if (f==='month' && (td.getMonth()!==now.getMonth()||td.getFullYear()!==now.getFullYear())) return false;
    if (q){
      const hay = (tx.invNo+' '+(tx.cust||'')+' '+tx.items.map(i=>i.name).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const el = document.getElementById('hist-list');
  if (!list.length){ el.innerHTML='<div class="empty-msg">No transactions found</div>'; return; }
  const BC = {cash:'b-cash',card:'b-card',qr:'b-qr'};
  const BL = {cash:'Cash',card:'Card',qr:'PayNow'};
  el.innerHTML = list.map(tx=>{
    const d  = new Date(tx.date);
    const ds = d.toLocaleDateString('en-SG',{day:'2-digit',month:'short'});
    const ts = d.toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'});
    const prev = tx.items.slice(0,2).map(i=>`${i.name} ×${i.qty}`).join(', ')+(tx.items.length>2?'…':'');
    return `<div class="hist-item" onclick="viewTxn(${tx.id})">
      <div class="hi-left">
        <div class="hi-inv">${tx.invNo}</div>
        <div class="hi-date">${ds} ${ts}${tx.cust?' · '+tx.cust:''}</div>
        <div class="hi-preview">${prev}</div>
      </div>
      <div class="hi-right">
        <div class="hi-total">${fmt(tx.total)}</div>
        <span class="badge ${BC[tx.pay]||'b-cash'}">${BL[tx.pay]||tx.pay}</span>
      </div>
    </div>`;
  }).join('');
}

async function viewTxn(id){
  const tx = allTxns.find(t=>t.id===id);
  if (tx) showInvoice(tx);
}

/* ═══════════════════════════════════════
   REPORTS
═══════════════════════════════════════ */
async function loadReports(){
  const txns = await dbAll('txns');
  const now  = new Date();
  const tod  = txns.filter(t=>new Date(t.date).toDateString()===now.toDateString());
  const week = txns.filter(t=>new Date(t.date)>=new Date(now-7*864e5));
  const mon  = txns.filter(t=>{const d=new Date(t.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});

  const rev = arr => arr.reduce((s,t)=>s+t.total,0);
  const todRev = rev(tod), wkRev=rev(week), monRev=rev(mon);
  const avg = tod.length ? todRev/tod.length : 0;

  // 7-day chart
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const dayStr=d.toDateString();
    const dTxns=txns.filter(t=>new Date(t.date).toDateString()===dayStr);
    days.push({lbl:d.toLocaleDateString('en-SG',{weekday:'short'}), val:rev(dTxns), cnt:dTxns.length, isToday:i===0});
  }
  const maxVal=Math.max(...days.map(d=>d.val),1);

  // Top items (all time)
  const itemMap={};
  txns.forEach(tx=>tx.items.forEach(it=>{
    if(!itemMap[it.name]) itemMap[it.name]={qty:0,rev:0};
    itemMap[it.name].qty+=it.qty;
    itemMap[it.name].rev+=it.price*it.qty;
  }));
  const top=Object.entries(itemMap).map(([name,v])=>({name,...v})).sort((a,b)=>b.qty-a.qty).slice(0,8);
  const maxQty=top[0]?.qty||1;

  // Payment split (month)
  const payMap={cash:0,card:0,qr:0};
  mon.forEach(t=>{ payMap[t.pay]=(payMap[t.pay]||0)+t.total; });
  const payTotal=Object.values(payMap).reduce((s,v)=>s+v,0)||1;
  const payColors={cash:'#2E7D32',card:'#1565C0',qr:'#7B1FA2'};
  const payLabels={cash:'Cash 💵',card:'Card 💳',qr:'PayNow 📱'};

  document.getElementById('rep-wrap').innerHTML = `
    <div class="rep-sec">
      <div class="rep-title">Today's Summary</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-val">${fmt(todRev)}</div><div class="stat-lbl">Revenue Today</div></div>
        <div class="stat-card"><div class="stat-val">${tod.length}</div><div class="stat-lbl">Transactions</div></div>
        <div class="stat-card"><div class="stat-val">${fmt(avg)}</div><div class="stat-lbl">Avg Order</div></div>
        <div class="stat-card"><div class="stat-val">${fmt(monRev)}</div><div class="stat-lbl">This Month</div></div>
      </div>
    </div>

    <div class="rep-sec">
      <div class="rep-title">Revenue – Last 7 Days</div>
      <div class="bar-chart">
        ${days.map(d=>`
          <div class="bar-col">
            <div class="bar-val-lbl">${d.val>0?fmt(d.val).replace('$',''):''}</div>
            <div class="bar-fill" style="height:${Math.max(d.val/maxVal*90,d.val>0?8:3)}px;${d.isToday?'background:var(--secondary)':''}"></div>
            <div class="bar-day">${d.lbl}</div>
          </div>`).join('')}
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:4px">
        7-day total: ${fmt(wkRev)} &nbsp;|&nbsp; ${week.length} orders
      </div>
    </div>

    <div class="rep-sec">
      <div class="rep-title">Top Selling Items (All Time)</div>
      ${top.length ? top.map((it,i)=>`
        <div class="top-row">
          <div class="top-rank">#${i+1}</div>
          <div class="top-info">
            <div class="top-name">${it.name}</div>
            <div class="top-bar-bg"><div class="top-bar-fg" style="width:${it.qty/maxQty*100}%"></div></div>
          </div>
          <div class="top-right">
            <div class="top-rev">${fmt(it.rev)}</div>
            <div class="top-qty">${it.qty} sold</div>
          </div>
        </div>`).join('')
      : '<div class="empty-msg">No sales data yet</div>'}
    </div>

    <div class="rep-sec">
      <div class="rep-title">Payment Methods (This Month)</div>
      ${Object.entries(payMap).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`
        <div class="pay-bar-row">
          <div class="pay-bar-meta">
            <span>${payLabels[m]}</span>
            <span style="font-weight:700">${fmt(v)} &nbsp;${Math.round(v/payTotal*100)}%</span>
          </div>
          <div class="pay-bar-bg">
            <div class="pay-bar-fg" style="width:${v/payTotal*100}%;background:${payColors[m]}"></div>
          </div>
        </div>`).join('')||'<div class="empty-msg">No data this month</div>'}
    </div>
  `;
}

/* ═══════════════════════════════════════
   SETTINGS
═══════════════════════════════════════ */
function renderSettings(){
  document.getElementById('set-wrap').innerHTML = `
    <div class="set-sec">
      <div class="set-title">Stall Information</div>
      <div class="form-group"><label class="form-lbl">Stall Name</label>
        <input type="text" class="form-inp" id="s-name" value="${esc(cfg.stallName)}"></div>
      <div class="form-group"><label class="form-lbl">Address</label>
        <input type="text" class="form-inp" id="s-addr" value="${esc(cfg.address)}"></div>
      <div class="form-group"><label class="form-lbl">Phone</label>
        <input type="text" class="form-inp" id="s-phone" value="${esc(cfg.phone)}"></div>
      <div class="form-group"><label class="form-lbl">GST Registration No.</label>
        <input type="text" class="form-inp" id="s-gst" value="${esc(cfg.gstNo)}"></div>
      <div class="form-group form-row">
        <label class="form-lbl" style="margin:0">Enable GST (${cfg.gstRate}%)</label>
        <label class="toggle">
          <input type="checkbox" id="s-gst-on" ${cfg.gstEnabled?'checked':''}>
          <span class="toggle-track"></span>
        </label>
      </div>
      <button class="save-btn" onclick="saveCfg()">Save Settings</button>
    </div>

    <div class="set-sec">
      <div class="set-title">Menu Items</div>
      <div id="menu-manage">
        ${menu.map(item=>`
          <div class="mm-item">
            <span class="mm-emoji">${item.emoji||'🍽'}</span>
            <div class="mm-info">
              <div class="mm-name">${item.name}</div>
              <div class="mm-cat">${item.cat}</div>
            </div>
            <div class="mm-price">${fmt(item.price)}</div>
            <label class="toggle">
              <input type="checkbox" ${item.avail?'checked':''} onchange="toggleItem(${item.id},this.checked)">
              <span class="toggle-track"></span>
            </label>
          </div>`).join('')}
      </div>
    </div>

    <div class="set-sec">
      <div class="set-title">Export Data</div>
      <button class="export-btn" onclick="exportCSV()">Download CSV Report</button>
    </div>
  `;
}

async function saveCfg(){
  cfg.stallName  = document.getElementById('s-name').value.trim()  || cfg.stallName;
  cfg.address    = document.getElementById('s-addr').value.trim();
  cfg.phone      = document.getElementById('s-phone').value.trim();
  cfg.gstNo      = document.getElementById('s-gst').value.trim();
  cfg.gstEnabled = document.getElementById('s-gst-on').checked;
  await dbPut('cfg',{k:'main',v:cfg});
  applyBrand();
  updateTotals();
  toast('Settings saved ✓');
}

async function toggleItem(id, avail){
  const item = menu.find(i=>i.id===id);
  if (!item) return;
  item.avail = avail;
  await dbPut('menu', item);
  renderMenu();
}

async function exportCSV(){
  const txns = await dbAll('txns');
  if (!txns.length){ toast('No transactions to export'); return; }
  const rows=['Invoice No,Date,Time,Customer,Items,Subtotal,GST,Total,Payment'];
  txns.forEach(tx=>{
    const d=new Date(tx.date);
    const items=tx.items.map(i=>`${i.name} x${i.qty}`).join('; ');
    rows.push(`"${tx.invNo}","${d.toLocaleDateString('en-SG')}","${d.toLocaleTimeString('en-SG')}","${tx.cust||''}","${items}",${tx.sub.toFixed(2)},${tx.tax.toFixed(2)},${tx.total.toFixed(2)},"${PAY_LABELS[tx.pay]||tx.pay}"`);
  });
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`bkt-sales-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function fmt(n){ return `${cfg.sym}${n.toFixed(2)}`; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function openOverlay(id){  document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

/* ═══════════════════════════════════════
   START
═══════════════════════════════════════ */
init().catch(err=>{ console.error(err); alert('Failed to initialise database: '+err.message); });
</script>
